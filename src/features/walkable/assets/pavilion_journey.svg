<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 140" width="190" height="140">
  <defs>
    <linearGradient id="pav-wall-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf7ef" />
      <stop offset="50%" stop-color="#eee3cf" />
      <stop offset="100%" stop-color="#ddceb4" />
    </linearGradient>
  </defs>

  <!-- Zemin Gölgesi -->
  <ellipse cx="95" cy="132" rx="90" ry="7" fill="rgba(23,43,71,0.2)" />

  <!-- Sağda Selçuklu Bayrağı / Flama (Konsept görselindeki turkuaz flama) -->
  <line x1="168" y1="6" x2="168" y2="40" stroke="#756452" stroke-width="2" />
  <polygon points="169,8 186,14 169,20" fill="#1b98a8" />
  <circle cx="174" cy="14" r="2.2" fill="#f5c35b" />

  <!-- Köşk Gövdesi -->
  <rect x="8" y="32" width="174" height="100" rx="5" fill="url(#pav-wall-grad)" stroke="#ccbc9d" stroke-width="2" />

  <!-- Çatı Saçağı ve Adaçayı Yeşili Çini Bordürü -->
  <rect x="4" y="24" width="182" height="14" rx="3" fill="#21573c" stroke="#123825" stroke-width="1.5" />
  <rect x="6" y="26" width="178" height="3" fill="#f5c35b" />

  <!-- Selçuklu Kemerli Revaklar (3 Açık Kemer) -->
  <g transform="translate(18, 48)">
    <path d="M 0 20 Q 22 0 44 20 L 44 78 L 0 78 Z" fill="#1b3152" stroke="#ccbc9d" stroke-width="2.5" />
    <path d="M 6 24 Q 22 8 38 24 L 38 78 L 6 78 Z" fill="#29466e" />
  </g>

  <g transform="translate(73, 48)">
    <path d="M 0 20 Q 22 0 44 20 L 44 78 L 0 78 Z" fill="#1b3152" stroke="#ccbc9d" stroke-width="2.5" />
    <path d="M 6 24 Q 22 8 38 24 L 38 78 L 6 78 Z" fill="#29466e" />
  </g>

  <g transform="translate(128, 48)">
    <path d="M 0 20 Q 22 0 44 20 L 44 78 L 0 78 Z" fill="#1b3152" stroke="#ccbc9d" stroke-width="2.5" />
    <path d="M 6 24 Q 22 8 38 24 L 38 78 L 6 78 Z" fill="#29466e" />
  </g>

  <!-- Mermer Sütun Gövdeleri ve Başlıkları -->
  <rect x="14" y="66" width="6" height="60" fill="#fcf7ee" stroke="#bda885" stroke-width="1" />
  <rect x="65" y="66" width="6" height="60" fill="#fcf7ee" stroke="#bda885" stroke-width="1" />
  <rect x="120" y="66" width="6" height="60" fill="#fcf7ee" stroke="#bda885" stroke-width="1" />
  <rect x="170" y="66" width="6" height="60" fill="#fcf7ee" stroke="#bda885" stroke-width="1" />

  <!-- Tabela -->
  <rect x="36" y="32" width="118" height="18" rx="4" fill="#172b47" stroke="#2d7350" stroke-width="1.5" />
  <text x="95" y="44.5" fill="#ffffff" font-size="8.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">KAMPÜS YOLCULUĞUM</text>

  <!-- Mermer Taban Basamakları -->
  <rect x="10" y="126" width="170" height="4" rx="1" fill="#fdfaf3" stroke="#bda885" stroke-width="1" />
  <rect x="6" y="130" width="178" height="5" rx="1.5" fill="#eee1ca" stroke="#bda885" stroke-width="1" />
</svg>