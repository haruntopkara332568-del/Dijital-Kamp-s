<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 140" width="190" height="140">
  <defs>
    <!-- Zemin gölgesi -->
    <radialGradient id="kioskShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>

    <!-- Taş Kaide Degradesi -->
    <linearGradient id="stoneBaseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8cbb5"/>
      <stop offset="25%" stop-color="#f1e7d4"/>
      <stop offset="75%" stop-color="#e2d6c1"/>
      <stop offset="100%" stop-color="#c5b69c"/>
    </linearGradient>

    <!-- Ahşap Çatı Degradesi -->
    <linearGradient id="roofWoodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8c4e23"/>
      <stop offset="50%" stop-color="#6f3b18"/>
      <stop offset="100%" stop-color="#4d280e"/>
    </linearGradient>

    <!-- Parşömen Dokusu -->
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbf2"/>
      <stop offset="70%" stop-color="#faefd4"/>
      <stop offset="100%" stop-color="#eedbad"/>
    </linearGradient>

    <!-- Fener Işığı Halesi -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. ZEMİN GÖLGESİ -->
  <ellipse cx="95" cy="132" rx="85" ry="8" fill="url(#kioskShadow)"/>

  <!-- 2. TAŞ KAİDE VE MERDİVEN BASAMAKLARI -->
  <rect x="15" y="122" width="160" height="10" rx="3" fill="#b9ab92" stroke="#8c7e66" stroke-width="1"/>
  <rect x="25" y="114" width="140" height="9" rx="2" fill="url(#stoneBaseGrad)" stroke="#a3937a" stroke-width="1"/>

  <!-- 3. SELÇUKLU OYMA TAŞ SÜTUNLAR -->
  <!-- Sol Sütun -->
  <rect x="30" y="32" width="16" height="83" rx="2" fill="url(#stoneBaseGrad)" stroke="#9c8c73" stroke-width="1"/>
  <!-- Sütun Başlığı ve Kaidesi -->
  <path d="M27 32 L49 32 L46 38 L30 38 Z" fill="#b1a187"/>
  <rect x="28" y="108" width="20" height="6" fill="#b1a187" rx="1"/>

  <!-- Sağ Sütun -->
  <rect x="144" y="32" width="16" height="83" rx="2" fill="url(#stoneBaseGrad)" stroke="#9c8c73" stroke-width="1"/>
  <path d="M141 32 L163 32 L160 38 L144 38 Z" fill="#b1a187"/>
  <rect x="142" y="108" width="20" height="6" fill="#b1a187" rx="1"/>

  <!-- 4. ARKA PANO GÖVDESİ & TURKUAZ ÇİNİ ŞERİDİ -->
  <rect x="44" y="36" width="102" height="78" fill="#e8dfcc" stroke="#baa88e" stroke-width="1"/>
  <!-- Turkuaz Bordür Şeridi -->
  <rect x="45" y="36" width="100" height="8" fill="#0d9488"/>
  <g fill="#5eead4" opacity="0.8">
    <polygon points="50,40 54,37 58,40 54,43"/>
    <polygon points="62,40 66,37 70,40 66,43"/>
    <polygon points="74,40 78,37 82,40 78,43"/>
    <polygon points="86,40 90,37 94,40 90,43"/>
    <polygon points="98,40 102,37 106,40 102,43"/>
    <polygon points="110,40 114,37 118,40 114,43"/>
    <polygon points="122,40 126,37 130,40 126,43"/>
    <polygon points="134,40 138,37 142,40 138,43"/>
  </g>

  <!-- 5. GÖREV PARŞÖMENLERİ VE DUYURU LEVHALARI -->
  <!-- Ana Görev Parşömeni (Sol) -->
  <g transform="translate(48, 48)">
    <rect x="0" y="0" width="44" height="60" rx="3" fill="url(#parchmentGrad)" stroke="#d4b982" stroke-width="1"/>
    <!-- Parşömen Raptiyesi / Mühür -->
    <circle cx="22" cy="5" r="3" fill="#b91c1c"/>
    <circle cx="22" cy="5" r="1.5" fill="#fca5a5"/>
    <!-- Çizgiler (El yazısı simülasyonu) -->
    <line x1="6" y1="13" x2="38" y2="13" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="20" x2="34" y2="20" stroke="#78716c" stroke-width="1" stroke-linecap="round"/>
    <line x1="6" y1="26" x2="36" y2="26" stroke="#78716c" stroke-width="1" stroke-linecap="round"/>
    <line x1="6" y1="32" x2="28" y2="32" stroke="#78716c" stroke-width="1" stroke-linecap="round"/>
    <line x1="6" y1="38" x2="35" y2="38" stroke="#78716c" stroke-width="1" stroke-linecap="round"/>
    <!-- Görev Onay Yıldızı -->
    <polygon points="22,45 24,50 29,50 25,53 26.5,58 22,55 17.5,58 19,53 15,50 20,50" fill="#f59e0b"/>
  </g>

  <!-- İkinci Görev Parşömeni (Sağ) -->
  <g transform="translate(98, 48)">
    <rect x="0" y="0" width="44" height="60" rx="3" fill="url(#parchmentGrad)" stroke="#d4b982" stroke-width="1"/>
    <circle cx="22" cy="5" r="3" fill="#0284c7"/>
    <circle cx="22" cy="5" r="1.5" fill="#7dd3fc"/>
    <line x1="6" y1="13" x2="36" y2="13" stroke="#0369a1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="20" x2="38" y2="20" stroke="#78716c" stroke-width="1" stroke-linecap="round"/>
    <line x1="6" y1="26" x2="32" y2="26" stroke="#78716c" stroke-width="1" stroke-linecap="round"/>
    <line x1="6" y1="32" x2="37" y2="32" stroke="#78716c" stroke-width="1" stroke-linecap="round"/>
    <line x1="6" y1="38" x2="30" y2="38" stroke="#78716c" stroke-width="1" stroke-linecap="round"/>
    <!-- Selçuklu Rozet İkonu -->
    <circle cx="22" cy="50" r="5" fill="#0d9488"/>
    <polygon points="22,46 25,50 22,54 19,50" fill="#fef08a"/>
  </g>

  <!-- 6. AHŞAP SAÇAK VE ÇATI (Geleneksel Kemerli Kök Saçak) -->
  <path d="M12 30 L95 8 L178 30 L168 36 L95 18 L22 36 Z" fill="url(#roofWoodGrad)" stroke="#3e1f0b" stroke-width="1"/>
  <!-- Ahşap Destek Apayları -->
  <line x1="38" y1="32" x2="26" y2="24" stroke="#5a2e12" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="152" y1="32" x2="164" y2="24" stroke="#5a2e12" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="95" y1="20" x2="95" y2="34" stroke="#5a2e12" stroke-width="2.5"/>

  <!-- Çatı Tepesi Alem / Selçuklu Yıldızı -->
  <circle cx="95" cy="7" r="4.5" fill="#d97706" stroke="#92400e" stroke-width="0.8"/>
  <polygon points="95,4 96.5,6.5 99.5,7 97,9 98,12 95,10 92,12 93,9 90.5,7 93.5,6.5" fill="#fef08a"/>

  <!-- 7. ASILI PİRİNÇ KANDİL & SICAK IŞIK -->
  <g transform="translate(95, 26)">
    <!-- Asma Zinciri -->
    <line x1="0" y1="0" x2="0" y2="10" stroke="#78350f" stroke-width="1"/>
    <!-- Işık Halesi -->
    <circle cx="0" cy="14" r="22" fill="url(#lanternGlow)"/>
    <!-- Kandil Gövdesi -->
    <path d="M-4 10 L4 10 L3 16 L-3 16 Z" fill="#b45309"/>
    <circle cx="0" cy="13" r="2" fill="#fff" opacity="0.9"/>
  </g>

  <!-- 8. ALTIN YAZILI TABELA (KEŞİF GÖREVLERİ) -->
  <rect x="62" y="18" width="66" height="13" rx="2" fill="#451a03" stroke="#b45309" stroke-width="1"/>
  <text x="95" y="27.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="6.5" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="0.4">
    GÖREV PANOSU
  </text>
</svg>
